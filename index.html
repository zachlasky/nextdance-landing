<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NextDance</title>
    <meta
      name="description"
      content="NextDance — track your dance sessions. Activity, style, timestamped notes, all stored on your device."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-bg text-text">
    <header class="flex items-center justify-between px-6 py-6 md:px-12">
      <div class="flex items-center gap-2">
        <img src="/favicon.png" alt="" class="h-9 w-auto" />
        <span class="font-display text-lg text-text">NextDance</span>
      </div>
      <a
        href="#"
        class="rounded-full border border-border-strong px-4 py-2 text-sm text-text hover:border-gold hover:text-gold"
      >
        Get the app
      </a>
      <!-- TODO: replace href="#" with the real App Store link once NextDance is published -->
    </header>

    <main class="px-6 md:px-12">
      <section class="relative overflow-hidden rounded-3xl bg-bg-elevated p-8 md:p-16">
        <!-- decorative squiggle accent -->
        <svg
          class="pointer-events-none absolute inset-0 h-full w-full text-border-strong opacity-30"
          viewBox="0 0 800 400"
          fill="none"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <path
            d="M0 320 C 150 260, 250 380, 400 300 S 650 180, 800 260"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
          />
        </svg>

        <div class="relative flex flex-col md:flex-row md:items-center md:gap-12">
          <div class="md:flex-1">
            <h1 class="font-display text-5xl leading-none md:text-7xl">
              <span class="block font-semibold">TRACK YOUR</span>
              <span class="block italic text-text-muted">NIGHT</span>
            </h1>

            <p class="mt-6 max-w-md text-text-muted">
              Log every session — activity, style, timestamped notes. All
              stored on your device, nothing in the cloud.
            </p>

            <a
              href="#"
              class="mt-8 inline-block rounded-full bg-gold px-6 py-3 font-semibold text-bg"
            >
              Get the app
            </a>
            <!-- TODO: replace href="#" with the real App Store link once NextDance is published -->

            <div class="mt-16 flex items-center gap-4">
              <p class="text-sm text-text-muted">NextDance is available now</p>
              <div class="flex gap-3">
                <span
                  class="flex h-11 w-11 items-center justify-center rounded-full border border-border-strong text-text-dim"
                  aria-label="App Store"
                >
                  <svg
                    class="h-5 w-5"
                    viewBox="0 0 384 512"
                    fill="currentColor"
                    aria-hidden="true"
                  >
                    <path
                      d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107 125.2 25.2-.7 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.4-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.5-90-61.5-91.9zm-90.5-158.4c-24.4 1.5-52.6-13-69.9-29.3-13.7-13.1-25.9-32.9-25.9-51.3 0-2.4.4-4.8 1-6.9 5.4-.3 12.1.7 18.6 3 19.2 6.7 41.6 25.1 51.4 44.2 6.6 12.9 10.4 27.9 8.3 40.3z"
                    />
                  </svg>
                </span>
                <span
                  class="flex h-11 w-11 items-center justify-center rounded-full border border-border-strong text-text-dim"
                  aria-label="Google Play"
                >
                  <svg
                    class="h-5 w-5"
                    viewBox="0 0 512 512"
                    fill="currentColor"
                    aria-hidden="true"
                  >
                    <path
                      d="M99 20.6c-8 4.5-13 13-13 22.8v425.2c0 9.8 5 18.3 13 22.8l231-235.4L99 20.6z"
                    />
                    <path
                      d="M373 235l-58.6-30-63 60 63 60 58.6-30c14-9 22-22 22-30s-8-21-22-30z"
                    />
                  </svg>
                </span>
              </div>
            </div>
          </div>

          <div class="mt-12 flex justify-center md:mt-0 md:flex-1">
            <img
              src="/app-screenshot.png"
              alt="NextDance app screenshot"
              class="rounded-3xl border border-border-strong object-cover w-auto h-[28rem]  md:h-[40rem]"
            />
          </div>
        </div>
      </section>
    </main>
    <footer class="mt-16 flex items-center justify-between px-6 py-8 text-sm text-text-muted md:px-12">
      <a href="/privacy.html" class="hover:text-text-muted">Privacy Policy</a>
      <span>&copy; 2026 NextDance</span>
    </footer>
  </body>
</html>
